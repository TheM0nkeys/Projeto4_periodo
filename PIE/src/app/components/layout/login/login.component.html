<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-5-strong login-card">

    <!-- Cabeçalho -->
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">Bem-vindo</h3>
      <p class="text-muted">Insira suas credenciais para acessar a conta</p>
    </div>

    <form (ngSubmit)="submit()">

      <!-- Campo Email -->
      <mdb-form-control class="mb-4">
        <input
          mdbInput
          type="text"
          class="form-control"
          [(ngModel)]="usuario.nome"
          name="email"
          required
        />
        <label mdbLabel class="form-label">Usuario</label>
      </mdb-form-control>

      <!-- Campo Senha -->
      <mdb-form-control class="mb-4">
        <input
          mdbInput
          type="password"
          id="passwordInput"
          class="form-control"
          [(ngModel)]="usuario.cofre"
          name="password"
          required
        />
        <label mdbLabel class="form-label" for="passwordInput">Senha</label>
      </mdb-form-control>


      <!-- Botão de Submit -->
      <button
        mdbRipple
        type="submit"
        class="btn btn-primary btn-block mb-4 w-100 py-2">
        Entrar
      </button>
    </form>
  </div>

</div>
