<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-5-strong login-card">

    <!-- Cabeçalho -->
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">Bem-vindo</h3>
      <p class="text-muted">Insira suas credenciais para acessar a conta</p>
    </div>

    <form (ngSubmit)="submit()">

      <!-- Campo Email -->
      <mdb-form-control class="mb-4">
        <input
          mdbInput
          type="email"
          id="emailInput"
          class="form-control"
          [(ngModel)]="loginData.email"
          name="email"
          required
        />
        <label mdbLabel class="form-label" for="emailInput">Endereço de E-mail</label>
      </mdb-form-control>

      <!-- Campo Senha -->
      <mdb-form-control class="mb-4">
        <input
          mdbInput
          type="password"
          id="passwordInput"
          class="form-control"
          [(ngModel)]="loginData.password"
          name="password"
          required
        />
        <label mdbLabel class="form-label" for="passwordInput">Senha</label>
      </mdb-form-control>

      <!-- Lembrar-me e Esqueci a Senha -->
      <div class="row mb-4">
        <div class="col d-flex justify-content-start">
          <mdb-checkbox
            [(ngModel)]="loginData.rememberMe"
            name="rememberMe">
            Lembrar-me
          </mdb-checkbox>
        </div>

        <div class="col text-end">
          <a href="#" class="text-primary text-decoration-none small">Esqueceu a senha?</a>
        </div>
      </div>

      <!-- Botão de Submit -->
      <button
        mdbRipple
        type="submit"
        class="btn btn-primary btn-block mb-4 w-100 py-2">
        Entrar
      </button>

      <!-- Registrar-se -->
      <div class="text-center">
        <p class="text-muted mb-0">
          Não tem uma conta?
          <a href="#" class="text-primary text-decoration-none fw-bold">Cadastre-se</a>
        </p>
      </div>

    </form>
  </div>
</div>
